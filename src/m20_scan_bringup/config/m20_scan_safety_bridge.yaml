scan_m20_safety_bridge:
  ros__parameters:
    enable_m20_output: false
    yaw_deadzone_calibrated: false

    publish_rate: 20.0
    stop_cycles: 5
    nav_frame_id: 0

    max_vx: 0.05
    max_wz: 0.30
    max_ax: 0.10
    max_awz: 0.50
    yaw_zero_epsilon: 0.01
    min_yaw_cmd: 0.0

    command_timeout: 0.20
    body_pose_timeout: 0.50
    sensor_pose_timeout: 0.50
    front_cloud_timeout: 0.30
    motion_info_timeout: 0.50
    max_sensor_cloud_stamp_delta: 0.02

    command_topic: /scan/cmd_vel_debug
    body_pose_topic: /lio/robo/odom
    sensor_pose_topic: /scan/sensor_pose
    front_cloud_stamp_topic: /scan/front_cloud_stamp
    preview_topic: /scan/nav_cmd_preview
    status_topic: /scan/nav_safety_status
    nav_cmd_topic: /NAV_CMD
